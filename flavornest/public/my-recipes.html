<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Recipes — FlavorNest</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body { padding: 100px 20px 60px; max-width: 900px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
  .top-bar a { color: var(--gold); text-decoration: none; font-weight: 600; }

  .recipe-card2 {
    background: rgba(253,246,236,.05);
    border: 1px solid rgba(253,246,236,.12);
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 20px;
    display: flex;
    gap: 18px;
  }
  .recipe-card2 img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 12px;
    flex-shrink: 0;
    background: rgba(253,246,236,.08);
  }
  .rc2-body { flex: 1; min-width: 0; }
  .rc2-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .rc2-title { font-family: var(--font-display); font-size: 1.25rem; margin: 0; }
  .rc2-meta { font-size: .8rem; opacity: .65; margin-bottom: 10px; }

  .status-badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: .72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .status-approved { background: #2e7d32; color: #fff; }
  .status-pending { background: #e65100; color: #fff; }
  .status-rejected { background: #7f1d1d; color: #fff; }

  .rc2-actions { display: flex; gap: 10px; margin-top: 12px; }
  .rc2-actions button { font-size: .8rem; padding: 8px 16px; }
  .btn-danger { background: transparent; border: 1px solid #b84c2a; color: #e8a85a; border-radius: 8px; cursor: pointer; }
  .btn-danger:hover { background: rgba(184,76,42,.15); }

  .empty-state { text-align: center; padding: 60px 20px; opacity: .6; }

  /* Reuse the site's edit form modal look, kept lightweight here */
  .edit-overlay {
    position: fixed; inset: 0; background: rgba(26,16,7,.72); backdrop-filter: blur(7px);
    display: none; align-items: center; justify-content: center; padding: 24px; z-index: 1000;
  }
  .edit-overlay.open { display: flex; }
  .edit-modal {
    background: #fff; color: var(--ink); border-radius: 16px; width: 100%; max-width: 560px;
    max-height: 90vh; overflow-y: auto; padding: 28px;
  }
  .edit-modal h2 { font-family: var(--font-display); margin-bottom: 18px; }
  .edit-modal label { display: block; font-size: .8rem; font-weight: 600; margin: 14px 0 6px; }
  .edit-modal input, .edit-modal textarea, .edit-modal select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: .9rem;
  }
  .edit-modal textarea { min-height: 90px; resize: vertical; }
  .edit-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
</style>
</head>
<body>
  <div class="top-bar">
    <h1 style="font-family:var(--font-display);">📝 My Recipes</h1>
    <a href="index.html">← Back to FlavorNest</a>
  </div>

  <div id="recipesList"></div>

  <!-- Edit modal -->
  <div class="edit-overlay" id="editOverlay">
    <div class="edit-modal">
      <h2>Edit Recipe</h2>
      <form id="editForm">
        <label>Recipe photo (optional)</label>
        <img id="editImagePreview" alt="Current photo" style="width:100%; max-height:160px; object-fit:cover; border-radius:10px; margin-bottom:10px; display:none;" />
        <input type="file" id="editImage" accept="image/png,image/jpeg,image/webp,image/gif" />

        <label>Title</label>
        <input type="text" id="editTitle" required />
        <label>Cuisine</label>
        <input type="text" id="editCuisine" required />
        <label>Description</label>
        <textarea id="editDescription" required></textarea>
        <label>Time (minutes)</label>
        <input type="number" id="editTime" min="1" required />
        <label>Servings</label>
        <input type="number" id="editServings" min="1" />
        <label>Difficulty</label>
        <select id="editDifficulty">
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
        <div class="edit-actions">
          <button type="button" class="btn btn-outline" id="editCancel">Cancel</button>
          <button type="submit" class="btn btn-gold">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script-my-recipes.js"></script>
</body>
</html>
