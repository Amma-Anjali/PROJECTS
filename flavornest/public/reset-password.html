<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — FlavorNest</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .reset-card {
    background: #fff;
    color: var(--ink);
    max-width: 400px;
    width: 100%;
    border-radius: 20px;
    padding: 40px 32px;
  }
  .reset-card h2 { font-family: var(--font-display); margin-bottom: 8px; }
  .reset-card p { font-size: .85rem; opacity: .7; margin-bottom: 20px; }
  .reset-card input {
    width: 100%;
    background: var(--cream-mid);
    border: 1px solid rgba(26,16,7,.15);
    color: var(--ink);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .reset-status { font-size: .82rem; margin-top: 10px; }
</style>
</head>
<body>
  <div class="reset-card">
    <h2>🍜 Reset Password</h2>
    <p>Choose a new password for your FlavorNest account.</p>
    <form id="resetForm">
      <input type="password" id="newPassword" placeholder="New password (min 6 characters)" minlength="6" required />
      <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6" required />
      <button type="submit" class="btn btn-gold" style="width:100%;">Update Password</button>
      <p class="reset-status" id="resetStatus"></p>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const statusEl = document.getElementById('resetStatus');

    if (!token) {
      statusEl.textContent = 'Missing or invalid reset link. Please request a new one.';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) {
        statusEl.textContent = "Passwords don't match.";
        return;
      }
      if (!token) return;

      statusEl.textContent = 'Updating…';
      try {
        const res = await fetch(`/api/auth/reset-password/${token}`, {
          method: 'POST',
          credentials: 'include', // accept the session cookie the server sets
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Something went wrong');

        statusEl.textContent = 'Password updated! Redirecting…';
        setTimeout(() => { window.location.href = 'index.html'; }, 1200);
      } catch (err) {
        statusEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
